apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: default
type: Opaque
stringData:
  client-id: "YOUR_AZURE_CLIENT_ID"
  client-secret: "YOUR_AZURE_CLIENT_SECRET"
  tenant-id: "YOUR_AZURE_TENANT_ID"
  subscription-id: "YOUR_AZURE_SUBSCRIPTION_ID"
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-openai-secrets
  namespace: default
type: Opaque
stringData:
  endpoint: "YOUR_AZURE_OPENAI_ENDPOINT"
  api-key: "YOUR_AZURE_OPENAI_KEY"
  deployment: "YOUR_AZURE_OPENAI_DEPLOYMENT"
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-secrets
  namespace: default
type: Opaque
stringData:
  connection-string: "YOUR_STORAGE_CONNECTION_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: default
type: Opaque
stringData:
  hf-api-key: "YOUR_HUGGINGFACE_API_KEY"