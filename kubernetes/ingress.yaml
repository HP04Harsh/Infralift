apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infralift-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: infralift.YOUR_VM_IP.nip.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: infralift-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infralift-frontend-service
            port:
              number: 3000