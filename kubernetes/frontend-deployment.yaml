apiVersion: apps/v1
kind: Deployment
metadata:
  name: infralift-frontend
  namespace: default
  labels:
    app: infralift-frontend
    version: v1.2.0
spec:
  replicas: 5
  selector:
    matchLabels:
      app: infralift-frontend
  template:
    metadata:
      labels:
        app: infralift-frontend
        version: v1.2.0
    spec:
      containers:
      - name: frontend
        image: myadmin12/infralift-frontend:1.2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://infralift-backend-service:8000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: infralift-frontend-service
  namespace: default
  labels:
    app: infralift-frontend
spec:
  type: ClusterIP
  selector:
    app: infralift-frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  sessionAffinity: None