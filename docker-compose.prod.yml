version: '3.8'
services:
  frontend:
    image: ${DOCKER_REPO_FRONTEND}:latest
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production

  backend:
    image: ${DOCKER_REPO_BACKEND}:latest
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
