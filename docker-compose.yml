services:
  mongodb:
    image: mongo:7
    container_name: infralift-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infralift-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: infralift-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infralift-network
    restart: unless-stopped

  backend:
    image: myadmin12/infralift-backend:1.11.0
    container_name: infralift-backend
    ports:
      - "8001:8000"
    environment:
      # MongoDB
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=infralift

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - REDIS_SESSION_TTL=86400

      # App
      - DEBUG=False
      - PYTHONUNBUFFERED=1
      - API_V1_PREFIX=/api/v1
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]

      # --- Azure Authentication (Required) ---
      # Create a Service Principal in Azure AD:
      #   az ad sp create-for-rbac --name "infralift-sp" --role Contributor --scopes /subscriptions/<sub-id>
      - AZURE_CLIENT_ID=
      - AZURE_CLIENT_SECRET=
      - AZURE_TENANT_ID=
      - AZURE_SUBSCRIPTION_ID=

      # --- Azure OpenAI (Required for AI Chat) ---
      # Deploy a model in Azure OpenAI Studio > Deployments > gpt-4 / gpt-35-turbo
      - AZURE_OPENAI_ENDPOINT=
      - AZURE_OPENAI_KEY=
      - AZURE_OPENAI_DEPLOYMENT=
      - AZURE_OPENAI_API_VERSION=2024-02-15-preview

      # --- Azure Storage (Required for Terraform artifacts) ---
      # Create a Storage Account + Container "terraform-artifacts"
      - STORAGE_CONNECTION_STRING=
      - STORAGE_CONTAINER_NAME=terraform-artifacts

      # --- AI Provider (azure-openai | huggingface) ---
      - AI_PROVIDER=azure-openai

      # --- HuggingFace (Required when AI_PROVIDER=huggingface) ---
      - HF_API_KEY=

      # --- Billing Currency Override (e.g. INR, EUR, GBP) ---
      # Set to override automatic currency detection from Azure APIs
      - DEFAULT_BILLING_CURRENCY=
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - infralift-network
    restart: unless-stopped
    volumes:
      - terraform_state:/app/terraform/state

  frontend:
    image: myadmin12/infralift-frontend:1.11.0
    container_name: infralift-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - infralift-network
    restart: unless-stopped

networks:
  infralift-network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
  terraform_state:
